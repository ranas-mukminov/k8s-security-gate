apiVersion: apps/v1
kind: Deployment
metadata:
  name: dirty-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dirty-app
  template:
    metadata:
      labels:
        app: dirty-app
    spec:
      hostNetwork: true
      containers:
        - name: app
          image: nginx:latest
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
