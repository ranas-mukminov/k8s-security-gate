apiVersion: apps/v1
kind: Deployment
metadata:
  name: dirty-init
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dirty-init
  template:
    metadata:
      labels:
        app: dirty-init
    spec:
      initContainers:
        - name: evil-init
          image: busybox:1.36
          command: ["sh", "-c", "true"]
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
      containers:
        - name: app
          image: nginx:1.25
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
