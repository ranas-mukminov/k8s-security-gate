apiVersion: apps/v1
kind: Deployment
metadata:
  name: clean-app
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clean-app
  template:
    metadata:
      labels:
        app: clean-app
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: public.ecr.aws/nginx/nginx:1.27
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
          resources:
            limits:
              cpu: "100m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
